name: Feature request
description: Suggest a capability or adapter
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that the library doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A new port method, adapter, or option? Sketch the API if you can.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
